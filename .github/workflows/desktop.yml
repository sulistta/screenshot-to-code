name: Desktop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm tauri build --debug --no-bundle
      - name: Install native test driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked
      - name: Native integration
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-smoke.mjs
